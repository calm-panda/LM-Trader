# nginx reverse proxy for LM Trader
# ─────────────────────────────────────────────────────────────────────────────
# Install: sudo cp nginx/lm-trader.conf /etc/nginx/sites-available/lm-trader
#          sudo ln -sf /etc/nginx/sites-available/lm-trader \
#                      /etc/nginx/sites-enabled/lm-trader
#          sudo nginx -t && sudo systemctl reload nginx
#
# This config:
#   • Redirects plain HTTP (port 80) → HTTPS (port 443)
#   • Terminates TLS with the self-signed cert
#   • Proxies all HTTPS traffic → uvicorn on localhost:8000
#   • Adds security headers
# ─────────────────────────────────────────────────────────────────────────────

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    server_name _;  # Replace with your Tailscale hostname if desired

    # Self-signed cert (generated by scripts/generate_certs.sh)
    ssl_certificate     /home/panda/LM-Trader/certs/mypi.crt;
    ssl_certificate_key /home/panda/LM-Trader/certs/mypi.key;

    # TLS hardening
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    nosniff            always;
    add_header X-Frame-Options           SAMEORIGIN         always;
    add_header Referrer-Policy           same-origin        always;

    # Proxy to uvicorn
    location / {
        proxy_pass         https://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade          $http_upgrade;
        proxy_set_header   Connection       "upgrade";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Generous timeouts for long-lived connections (SSE, WebSocket)
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;

        # Buffer settings (off = streaming responses reach browser faster)
        proxy_buffering off;

        # Increase body size for strategy code uploads
        client_max_body_size 2M;

        # Allow self-signed upstream cert
        proxy_ssl_verify off;
    }

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
}
